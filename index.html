<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Fast Video Player & JSON Categorizer</title>
    <!-- Hls.js & Artplayer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1120; color: #ffffff; padding: 20px; }
        
        .tester-container {
            background-color: #161e2e;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto 20px auto;
        }

        .tester-container h2 { font-size: 18px; margin-bottom: 10px; color: #3b82f6; }
        .tester-container textarea {
            width: 100%;
            height: 140px;
            background-color: #0f172a;
            border: 1px solid #1f2937;
            border-radius: 6px;
            color: #38bdf8;
            font-family: monospace;
            padding: 12px;
            font-size: 13px;
            outline: none;
            resize: vertical;
        }

        .input-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }

        .file-upload-btn {
            background-color: #059669;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }
        .file-upload-btn input { display: none; }

        .tester-container button.load-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            flex: 1;
            transition: background 0.2s;
        }

        .tester-container button.load-btn:hover { background-color: #2563eb; }

        .download-bar {
            max-width: 1000px;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dl-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .dl-btn:hover { opacity: 0.9; }
        .dl-red { background: #dc2626; }
        .dl-green { background: #16a34a; }
        .dl-blue { background: #2563eb; }
        .dl-black { background: #374151; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .card {
            background-color: #161e2e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f2937;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .card-image-wrapper { width: 100%; aspect-ratio: 2 / 3; background-color: #0f172a; cursor: pointer; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 10px; }
        .card-title { font-size: 13px; font-weight: 600; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 36px; cursor: pointer; margin-bottom: 8px; }

        .color-options {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 6px;
            border-radius: 6px;
        }

        .color-checkbox {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }

        .color-checkbox.red { color: #ef4444; }
        .color-checkbox.green { color: #22c55e; }
        .color-checkbox.blue { color: #3b82f6; }

        #player-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b1120;
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .player-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        .player-main { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .player-title { font-size: 18px; font-weight: 600; color: #3b82f6; }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .video-wrapper iframe, #artplayer-container { width: 100%; height: 100%; border: none; }

        .active-code-box {
            margin-top: 15px;
            background: #161e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
        }

        .active-code-box h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .active-code-box textarea {
            width: 100%;
            height: 150px;
            background-color: #0f172a;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            color: #10b981;
            font-family: monospace;
            padding: 10px;
            font-size: 12px;
            outline: none;
            resize: vertical;
        }

        .copy-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover { background: #059669; }

        .player-sidebar-wrapper { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
        .back-btn { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .meta-box {
            background: #161e2e;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meta-box h4 { font-size: 13px; color: #38bdf8; }

        .meta-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-field label { font-size: 11px; color: #94a3b8; }
        .meta-field input {
            background: #0f172a;
            border: 1px solid #374151;
            border-radius: 4px;
            color: #fff;
            padding: 8px;
            font-size: 12px;
            outline: none;
        }
        .meta-field input:focus { border-color: #3b82f6; }

        .save-meta-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .save-meta-btn:hover { background: #2563eb; }

        .episodes-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
        .ep-btn { background: #161e2e; border: 1px solid #1f2937; color: #fff; padding: 10px; font-size: 12px; border-radius: 4px; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-btn.active, .ep-btn:hover { background: #3b82f6; border-color: #3b82f6; }

        @media (max-width: 800px) {
            .player-container { flex-direction: column; }
            .player-sidebar-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="home-view">
        <div class="tester-container">
            <h2>Universal JSON Code Tester</h2>
            <textarea id="jsonInput" placeholder="এখানে আপনার JSON পেস্ট করুন অথবা ফাইল আপলোড করুন..."></textarea>
            
            <div class="input-controls">
                <label class="file-upload-btn">
                    📁 Upload File
                    <input type="file" id="fileInput" accept=".json,.txt" onchange="handleFileUpload(event)">
                </label>
                <button class="load-btn" onclick="processTestCode()">Load Content</button>
            </div>
            <div id="loadStatus" style="font-size:12px; color:#38bdf8; margin-top:8px;"></div>
        </div>

        <div class="download-bar">
            <button class="dl-btn dl-red" onclick="downloadCategory('red')">Download red.json</button>
            <button class="dl-btn dl-green" onclick="downloadCategory('green')">Download green.json</button>
            <button class="dl-btn dl-blue" onclick="downloadCategory('blue')">Download blow.json</button>
            <button class="dl-btn dl-black" onclick="downloadCategory('black')">Download black.json</button>
        </div>

        <div id="main-content"></div>
    </div>

    <!-- Player View -->
    <div id="player-view">
        <div class="player-container">
            <div class="player-main">
                <h2 id="videoTitle" class="player-title">Streaming Video</h2>
                <div class="video-wrapper">
                    <iframe id="iframePlayer" src="" allowfullscreen style="display:none;" referrerpolicy="no-origin"></iframe>
                    <div id="artplayer-container" style="display:none;"></div>
                </div>

                <div class="active-code-box">
                    <h3>
                        <span>Edit & Copy JSON Code:</span>
                        <button class="copy-btn" onclick="copyCurrentCode()">Copy Edited Code</button>
                    </h3>
                    <textarea id="currentCodeBox" placeholder="এখানে কোড প্রদর্শিত হবে..."></textarea>
                </div>
            </div>

            <div class="player-sidebar-wrapper">
                <button class="back-btn" onclick="closePlayerPage()">← Back to Home</button>
                
                <div class="meta-box">
                    <h4>Edit Details (Press Enter to Save)</h4>
                    <div class="meta-field">
                        <label>Country:</label>
                        <input type="text" id="inputCountry" placeholder="e.g. Japan, USA" onkeypress="handleMetaEnter(event)">
                    </div>
                    <div class="meta-field">
                        <label>Language:</label>
                        <input type="text" id="inputLanguage" placeholder="e.g. Japanese, Bangla" onkeypress="handleMetaEnter(event)">
                    </div>
                    <button class="save-meta-btn" onclick="saveMetaData()">Save & Update JSON</button>
                </div>

                <div id="playerSidebar"></div>
            </div>
        </div>
    </div>

    <script>
        let artPlayerInstance = null;
        let lastScrollPosition = 0;
        let currentItem = null;
        let currentSelectedEpKey = '';
        let loadedItems = [];

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loadStatus').innerText = "Reading file...";
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('jsonInput').value = e.target.result;
                processTestCode();
            };
            reader.readAsText(file);
        }

        function processTestCode() {
            let rawInput = document.getElementById('jsonInput').value.trim();
            if (!rawInput) return alert("দয়া করে টেক্সট বক্সে কোড পেস্ট করুন অথবা ফাইল আপলোড করুন!");

            let items = smartExtractMediaList(rawInput);

            if (items && items.length > 0) {
                renderGridProgressive(items);
            } else {
                alert("কোনো ভ্যালিড মিডিয়া তথ্য পাওয়া যায়নি!");
                document.getElementById('loadStatus').innerText = "";
            }
        }

        function smartExtractMediaList(rawText) {
            let results = [];
            let cleanText = rawText.trim();
            if (!cleanText.startsWith('[')) cleanText = '[' + cleanText;
            if (!cleanText.endsWith(']')) cleanText = cleanText + ']';
            cleanText = cleanText.replace(/,\s*([\]}])/g, '$1');

            try {
                let parsedJson = JSON.parse(cleanText);
                if (Array.isArray(parsedJson)) {
                    parsedJson.forEach((element, idx) => {
                        let type = "movie";
                        let name = element.title || element.name || `Item ${idx + 1}`;
                        let image = element.image || "";
                        let category = element.category || "";
                        let country = element.country || "";
                        let language = element.language || "";
                        let episodes = {};

                        if (element.type === "tv-channel" || element.CN) {
                            type = "tv-channel";
                            let channelData = element.CN ? Object.values(element.CN)[0] : {};
                            name = channelData.name || name;
                            image = element.image || channelData.tvglogo || "";
                            episodes["Live Stream"] = channelData.url || "";
                        } 
                        else if (element.episodes) {
                            type = "series";
                            episodes = element.episodes;
                        } 
                        else {
                            let videoUrl = element["Movie link"] || element.link || element.url || element.file;
                            if (videoUrl) episodes["Play Movie"] = videoUrl;
                        }

                        if (Object.keys(episodes).length > 0) {
                            results.push({
                                id: idx,
                                type,
                                name,
                                image,
                                category,
                                country,
                                language,
                                episodes,
                                rawElement: element,
                                tags: { red: false, green: false, blue: false }
                            });
                        }
                    });
                }
            } catch (e) {
                alert("JSON কোডে ভুল আছে! সঠিক JSON ব্যবহার করুন।");
            }

            return results;
        }

        function renderGridProgressive(items) {
            loadedItems = items;
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            
            const grid = document.createElement('div');
            grid.className = 'media-grid';
            mainContent.appendChild(grid);

            let index = 0;
            const chunkSize = 25; // Asty asty batch load

            function renderBatch() {
                const fragment = document.createDocumentFragment();
                const limit = Math.min(index + chunkSize, items.length);

                for (; index < limit; index++) {
                    const item = items[index];
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.id = `card-${item.id}`;
                    card.innerHTML = `
                        <div class="card-image-wrapper">
                            <img src="${item.image}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=Poster'">
                        </div>
                        <div class="card-info">
                            <div class="card-title">${item.name}</div>
                            <div class="color-options">
                                <label class="color-checkbox red">
                                    <input type="checkbox" ${item.tags.red ? 'checked' : ''} onchange="toggleTag(${item.id}, 'red', this.checked)"> Red
                                </label>
                                <label class="color-checkbox green">
                                    <input type="checkbox" ${item.tags.green ? 'checked' : ''} onchange="toggleTag(${item.id}, 'green', this.checked)"> Green
                                </label>
                                <label class="color-checkbox blue">
                                    <input type="checkbox" ${item.tags.blue ? 'checked' : ''} onchange="toggleTag(${item.id}, 'blue', this.checked)"> Blue
                                </label>
                            </div>
                        </div>
                    `;

                    card.querySelector('.card-image-wrapper').onclick = () => openPlayerPage(item);
                    card.querySelector('.card-title').onclick = () => openPlayerPage(item);

                    fragment.appendChild(card);
                }

                grid.appendChild(fragment);
                document.getElementById('loadStatus').innerText = `Loaded ${index} / ${items.length} items...`;

                if (index < items.length) {
                    setTimeout(renderBatch, 10);
                } else {
                    document.getElementById('loadStatus').innerText = `Successfully Loaded ${items.length} items.`;
                }
            }

            renderBatch();
        }

        function toggleTag(id, color, isChecked) {
            const item = loadedItems.find(i => i.id === id);
            if (item) {
                item.tags[color] = isChecked;
            }
        }

        function downloadCategory(categoryName) {
            let filteredRawData = [];

            if (categoryName === 'black') {
                filteredRawData = loadedItems
                    .filter(item => !item.tags.red && !item.tags.green && !item.tags.blue)
                    .map(item => item.rawElement);
            } else {
                let targetColor = categoryName === 'blow' ? 'blue' : categoryName;
                filteredRawData = loadedItems
                    .filter(item => item.tags[targetColor])
                    .map(item => item.rawElement);
            }

            if (filteredRawData.length === 0) {
                return alert(`No items found for ${categoryName}.json!`);
            }

            let fileName = categoryName === 'blue' ? 'blow.json' : `${categoryName}.json`;
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(filteredRawData, null, 2));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function openPlayerPage(item) {
            currentItem = item;
            lastScrollPosition = window.scrollY || document.documentElement.scrollTop;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';

            document.getElementById('inputCountry').value = item.country || '';
            document.getElementById('inputLanguage').value = item.language || '';

            const sidebar = document.getElementById('playerSidebar');
            sidebar.innerHTML = '<h3 style="margin-top:10px; margin-bottom:10px; font-size:14px; color:#94a3b8;">Episodes / Sources</h3><div class="episodes-grid" id="epGrid"></div>';
            
            const epGrid = document.getElementById('epGrid');
            const epKeys = Object.keys(item.episodes);

            epKeys.forEach((indexKey, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.innerText = indexKey;
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSelectedEpKey = indexKey;
                    loadVideo(item.episodes[indexKey], `${item.name} (${indexKey})`);
                    generateCodeBox(item, indexKey);
                };
                epGrid.appendChild(btn);
                if (index === 0) btn.click();
            });
        }

        function handleMetaEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                saveMetaData();
            }
        }

        function saveMetaData() {
            if (!currentItem) return;
            
            currentItem.country = document.getElementById('inputCountry').value.trim();
            currentItem.language = document.getElementById('inputLanguage').value.trim();
            
            if (currentItem.rawElement) {
                currentItem.rawElement.country = currentItem.country;
                currentItem.rawElement.language = currentItem.language;
            }

            generateCodeBox(currentItem, currentSelectedEpKey);
            alert("Details updated!");
        }

        function generateCodeBox(item, selectedEpKey) {
            let outputObject = {};

            if (item.type === "movie") {
                outputObject = {
                    "title": item.name,
                    "image": item.image,
                    "category": item.category,
                    "country": item.country,
                    "language": item.language,
                    "Movie link": item.episodes[selectedEpKey] || ""
                };
            } else if (item.type === "series") {
                outputObject = {
                    "name": item.name,
                    "image": item.image,
                    "category": item.category || "ANIMATION",
                    "country": item.country,
                    "language": item.language,
                    "episodes": item.episodes
                };
            } else if (item.type === "tv-channel") {
                outputObject = {
                    "type": "tv-channel",
                    "country": item.country || "Bangladesh",
                    "language": item.language,
                    "image": item.image,
                    "CN": {
                        "1": {
                            "name": item.name,
                            "tvglogo": item.image,
                            "group": item.category,
                            "url": item.episodes[selectedEpKey] || ""
                        }
                    }
                };
            }

            document.getElementById('currentCodeBox').value = JSON.stringify(outputObject, null, 2);
        }

        function copyCurrentCode() {
            const codeBox = document.getElementById('currentCodeBox');
            if (!codeBox.value) return alert('কপি করার মতো কোনো কোড নেই!');
            
            codeBox.select();
            document.execCommand('copy');
            alert('কোড সফলভাবে কপি হয়েছে!');
        }

        function loadVideo(url, title) {
            const iframe = document.getElementById('iframePlayer');
            const artContainer = document.getElementById('artplayer-container');
            document.getElementById('videoTitle').innerText = title;

            // Fast Destroy existing instance
            if (artPlayerInstance) {
                artPlayerInstance.destroy(false);
                artPlayerInstance = null;
            }

            let cleanUrl = (url || '').trim();

            if (cleanUrl.includes('drive.google.com')) {
                const match = cleanUrl.match(/\/d\/([^\/]+)/) || cleanUrl.match(/id=([^&]+)/);
                if (match && match[1]) {
                    cleanUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
                }
            }

            const lowerUrl = cleanUrl.toLowerCase();

            // Direct Media Streams (m3u8/mp4/mkv/webm) -> Artplayer fast load
            if (lowerUrl.includes('.m3u8') || lowerUrl.includes('.mp4') || lowerUrl.includes('.mkv') || lowerUrl.includes('.webm')) {
                iframe.style.display = 'none';
                iframe.src = '';
                artContainer.style.display = 'block';

                artPlayerInstance = new Artplayer({
                    container: '#artplayer-container',
                    url: cleanUrl,
                    volume: 0.8,
                    isLive: lowerUrl.includes('.m3u8'),
                    autoplay: true,
                    setting: true,
                    pip: true,
                    fullscreen: true,
                    fullscreenWeb: true,
                    miniProgressBar: true,
                    backdrop: true,
                    playsInline: true,
                    autoPlayback: true,
                    airplay: true,
                    customType: {
                        m3u8: function (video, url, art) {
                            if (Hls.isSupported()) {
                                if (art.hls) art.hls.destroy();
                                const hls = new Hls({
                                    enableWorker: true,
                                    lowLatencyMode: true,
                                });
                                hls.loadSource(url);
                                hls.attachMedia(video);
                                art.hls = hls;
                                art.on('destroy', () => hls.destroy());
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = url;
                            } else {
                                art.notice.show = 'Unsupported playback format: m3u8';
                            }
                        },
                    },
                });
            } else {
                // Non-direct URLs -> Iframe
                artContainer.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = cleanUrl;
            }
        }

        function closePlayerPage() {
            // Instant hide & return home
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            
            window.scrollTo(0, lastScrollPosition);

            const iframe = document.getElementById('iframePlayer');
            iframe.src = 'about:blank';
            iframe.style.display = 'none';

            const artContainer = document.getElementById('artplayer-container');
            artContainer.style.display = 'none';

            if (artPlayerInstance) {
                try {
                    if (artPlayerInstance.hls) {
                        artPlayerInstance.hls.destroy();
                        artPlayerInstance.hls = null;
                    }
                    artPlayerInstance.destroy(true);
                } catch (e) {
                    console.log(e);
                }
                artPlayerInstance = null;
            }
        }
    </script>
</body>
</html>
