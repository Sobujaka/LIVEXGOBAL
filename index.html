<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #ffffff;
            padding: 15px;
        }

        .player-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        .player-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .player-title {
            font-size: 20px;
            font-weight: 600;
            color: #3b82f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .server-buttons {
            display: inline-flex;
            gap: 8px;
            vertical-align: middle;
        }

        .server-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-btn:hover, .server-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe, .artplayer-app {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-sidebar-wrapper {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #161e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            max-height: 85vh;
            overflow-y: auto;
        }

        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: #94a3b8; font-weight: 600; }
        .filter-group select, .filter-group input {
            background: #0f172a;
            color: #fff;
            border: 1px solid #1f2937;
            padding: 8px 10px;
            border-radius: 5px;
            outline: none;
            font-size: 13px;
        }

        .filter-group input::placeholder {
            color: #64748b;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: #3b82f6;
        }

        .channel-list { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            margin-top: 5px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #1f2937;
            transition: all 0.2s;
        }

        .channel-item:hover, .channel-item.active { border-color: #3b82f6; background: #1e293b; }
        .channel-item img { width: 35px; height: 35px; object-fit: contain; border-radius: 4px; }
        .channel-item span { font-size: 13px; font-weight: 500; }

        @media (max-width: 1024px) {
            .player-container { flex-direction: column; }
            .player-sidebar-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="player-main">
            <h2 id="videoTitle" class="player-title">Select a channel</h2>
            <div class="video-wrapper" id="videoContainer">
                <iframe id="iframePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="display:none;"></iframe>
                <div id="artPlayerContainer" class="artplayer-app" style="display:none;"></div>
            </div>
        </div>

        <div class="player-sidebar-wrapper">
            <div id="playerSidebar" class="player-sidebar"></div>
        </div>
    </div>

    <script>
        let artInstance = null, hlsInstance = null, streamTimeout = null;
        let allCountryItems = [];
        let channelChangeCount = 0; // প্রতিবার চ্যানেল পরিবর্তন ট্র্যাক করার জন্য কাউন্টার
        const adUrl = "https://www.profitableratecpmnetwork.com/r4buartu2?key=e9db41196051b8cab237edbaf6cc4da0";
        const liveTvUrl = "https://raw.githubusercontent.com/Sobujaka/STREMXBD/refs/heads/main/a/b/c/d/e/m/c.json";

        function repairAndParseJSON(jsonText) {
            try {
                return JSON.parse(jsonText);
            } catch (e) {
                try {
                    let cleaned = jsonText.replace(/"\s*\n*\r*\s*"/g, '","')
                                         .replace(/([0-9]|"|true|false|null)\s*\n*\r*\s*"([^"]+)":/g, '$1,"$2":')
                                         .replace(/,\s*([\]}])/g, '$1');
                    return JSON.parse(cleaned);
                } catch (repairError) {
                    return new Function("return " + jsonText)();
                }
            }
        }

        async function loadLiveTV() {
            try {
                const res = await fetch(liveTvUrl);
                const textData = await res.text();
                const data = repairAndParseJSON(textData);
                
                if (data && Array.isArray(data)) {
                    allCountryItems = data;
                    setupLiveTVPlayer();
                }
            } catch (err) {
                console.error("Failed to load Live TV data", err);
            }
        }

        function setupLiveTVPlayer() {
            const sidebar = document.getElementById('playerSidebar');
            
            let countryOptions = '<option value="all">Country: All</option>';
            const countriesSet = new Set();

            allCountryItems.forEach(item => {
                if (item.country) {
                    countriesSet.add(item.country.trim());
                }
            });

            Array.from(countriesSet).sort().forEach(countryName => {
                countryOptions += `<option value="${countryName}">${countryName}</option>`;
            });

            sidebar.innerHTML = `
                <div class="filter-group">
                    <label>Country</label>
                    <select id="countrySelect" onchange="onCountryChange()">${countryOptions}</select>
                </div>
                <div class="filter-group">
                    <label>Group / Category</label>
                    <select id="groupSelect" onchange="filterChannels()"><option value="all">Group: All</option></select>
                </div>
                <div class="filter-group">
                    <label>Search Channel</label>
                    <input type="text" id="channelSearchInput" placeholder="Search channel..." oninput="filterChannels()">
                </div>
                <div id="channelList" class="channel-list"></div>
            `;

            onCountryChange();
        }

        function onCountryChange() {
            const selectedCountry = document.getElementById('countrySelect').value;
            const groupSelect = document.getElementById('groupSelect');
            const groupsSet = new Set();
            
            window.currentChannels = {};

            allCountryItems.forEach(item => {
                if (selectedCountry === 'all' || item.country === selectedCountry) {
                    if (item.CN) {
                        Object.values(item.CN).forEach(ch => {
                            if (ch.group) groupsSet.add(ch.group.trim());
                            
                            const chNameKey = ch.name.trim().toLowerCase();

                            if (!window.currentChannels[chNameKey]) {
                                window.currentChannels[chNameKey] = {
                                    name: ch.name,
                                    tvglogo: ch.tvglogo,
                                    group: ch.group ? ch.group.trim() : 'Other',
                                    country: item.country || '',
                                    links: [ch.url]
                                };
                            } else {
                                if (!window.currentChannels[chNameKey].links.includes(ch.url)) {
                                    window.currentChannels[chNameKey].links.push(ch.url);
                                }
                            }
                        });
                    }
                }
            });

            let groupOptions = '<option value="all">Group: All</option>';
            Array.from(groupsSet).sort().forEach(g => {
                groupOptions += `<option value="${g}">${g}</option>`;
            });
            groupSelect.innerHTML = groupOptions;

            filterChannels();
        }

        function filterChannels() {
            const selectedGroup = document.getElementById('groupSelect').value;
            const searchQuery = document.getElementById('channelSearchInput').value.toLowerCase().trim();
            renderChannels(selectedGroup, searchQuery);
        }

        function renderChannels(group, search) {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            let isFirst = true;

            Object.values(window.currentChannels).forEach(ch => {
                const matchesGroup = (group === 'all' || ch.group === group);
                const matchesSearch = (!search || ch.name.toLowerCase().includes(search));

                if (matchesGroup && matchesSearch) {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
                        div.classList.add('active');
                        
                        // চ্যানেল পরিবর্তন কাউন্ট বৃদ্ধি করা এবং ৫ বার হলে লিঙ্ক নতুন ট্যাবে ওপেন করা
                        channelChangeCount++;
                        if (channelChangeCount >= 5) {
                            window.open(adUrl, '_blank');
                            channelChangeCount = 0; // কাউন্টার রিসেট করা
                        }

                        playChannelWithButtons(ch.links, ch.name, 0);
                    };
                    div.innerHTML = `<img src="${ch.tvglogo}" alt="${ch.name}" loading="lazy"><span>${ch.name}</span>`;
                    container.appendChild(div);
                    
                    if (isFirst) { 
                        div.click(); 
                        isFirst = false; 
                    }
                }
            });

            if (isFirst) {
                container.innerHTML = `<div style="color: #94a3b8; font-size: 13px; text-align: center; padding: 20px 0;">No channels found</div>`;
            }
        }

        function playChannelWithButtons(urls, title, activeIndex = 0) {
            if (!urls || urls.length === 0) return;

            const titleContainer = document.getElementById('videoTitle');
            
            let buttonsHTML = '';
            if (urls.length > 1) {
                buttonsHTML = '<div class="server-buttons">';
                urls.forEach((_, idx) => {
                    const activeClass = idx === activeIndex ? 'active' : '';
                    buttonsHTML += `<button class="server-btn ${activeClass}" onclick="switchServer(${idx})">Server ${idx + 1}</button>`;
                });
                buttonsHTML += '</div>';
            }

            titleContainer.innerHTML = `<span>${title}</span> ${buttonsHTML}`;

            window.switchServer = (index) => {
                playChannelWithButtons(urls, title, index);
            };

            loadVideo(urls[activeIndex], `${title} (Server ${activeIndex + 1})`, () => {
                console.log(`Server ${activeIndex + 1} failed.`);
            });
        }

        function destroyPlayers() {
            if (streamTimeout) {
                clearTimeout(streamTimeout);
                streamTimeout = null;
            }
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (artInstance) {
                artInstance.destroy();
                artInstance = null;
            }
        }

        function loadVideo(url, title, onErrorCallback = null) {
            const iframe = document.getElementById('iframePlayer');
            const artContainer = document.getElementById('artPlayerContainer');
            
            destroyPlayers();

            if (!url) {
                if (onErrorCallback) onErrorCallback();
                return;
            }

            const cleanUrl = url.trim();
            const lowerUrl = cleanUrl.toLowerCase();

            iframe.style.display = 'none';
            iframe.src = '';
            artContainer.style.display = 'block';

            let hasTriggeredError = false;
            const handleError = () => {
                if (!hasTriggeredError) {
                    hasTriggeredError = true;
                    destroyPlayers();
                    if (onErrorCallback) onErrorCallback();
                }
            };

            streamTimeout = setTimeout(() => {
                handleError();
            }, 8000);

            artInstance = new Artplayer({
                container: '#artPlayerContainer',
                url: cleanUrl,
                type: lowerUrl.includes('.m3u8') ? 'm3u8' : 'auto',
                customType: {
                    m3u8: function (video, videoUrl) {
                        if (Hls.isSupported()) {
                            hlsInstance = new Hls({
                                enableWorker: true,
                                lowLatencyMode: false,
                                maxBufferLength: 60,
                            });
                            hlsInstance.loadSource(videoUrl);
                            hlsInstance.attachMedia(video);
                            
                            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                                if (streamTimeout) {
                                    clearTimeout(streamTimeout);
                                    streamTimeout = null;
                                }
                            });

                            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                                if (data.fatal) handleError();
                            });
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = videoUrl;
                            video.addEventListener('loadedmetadata', () => {
                                if (streamTimeout) {
                                    clearTimeout(streamTimeout);
                                    streamTimeout = null;
                                }
                            });
                            video.addEventListener('error', handleError);
                        }
                    },
                },
                autoplay: true,
                pip: true,
                screenshot: true,
                fullscreen: true,
                fullscreenWeb: true,
                theme: '#3b82f6',
            });

            artInstance.on('video:playing', () => {
                if (streamTimeout) {
                    clearTimeout(streamTimeout);
                    streamTimeout = null;
                }
            });

            artInstance.on('error', handleError);
        }

        loadLiveTV();
    </script>
</body>
</html>
